<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe8d4"/>
      <stop offset="1" stop-color="#f1f8f1"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7bb662"/>
      <stop offset="1" stop-color="#4c8f3f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <g fill="#9cc7a3" opacity=".7">
    <rect x="40" y="170" width="70" height="170"/><rect x="120" y="120" width="60" height="220"/>
    <rect x="980" y="140" width="80" height="200"/><rect x="1070" y="190" width="70" height="150"/>
  </g>
  <path d="M0 330 Q600 290 1200 330 V800 H0Z" fill="url(#land)"/>
  <path d="M0 640 L1200 560 V800 H0Z" fill="#3d3d3d"/>
  <path d="M0 700 L1200 620" stroke="#f6d00b" stroke-width="8" stroke-dasharray="50 40"/>
  <!-- the plot -->
  <polygon points="300,420 880,400 960,540 220,570" fill="#a8d38c" stroke="#fff" stroke-width="6" stroke-dasharray="18 12"/>
  <g fill="#f6d00b" stroke="#024b1e" stroke-width="4">
    <rect x="290" y="400" width="18" height="34"/><rect x="872" y="380" width="18" height="34"/>
    <rect x="950" y="520" width="18" height="34"/><rect x="210" y="550" width="18" height="34"/>
  </g>
  <!-- dimension labels -->
  <g font-family="Poppins, Arial, sans-serif" font-weight="700" text-anchor="middle">
    <rect x="490" y="455" width="220" height="74" rx="37" fill="#024b1e"/>
    <text x="600" y="505" font-size="40" fill="#fff">30 × 40</text>
    <text x="590" y="395" font-size="26" fill="#024b1e">40 ft</text>
    <text x="210" y="500" font-size="26" fill="#024b1e">30 ft</text>
  </g>
  <g fill="#2f7a3a">
    <circle cx="140" cy="440" r="46"/><circle cx="1060" cy="420" r="52"/><circle cx="1110" cy="470" r="36"/>
  </g>
  <g fill="#6b4b2a"><rect x="134" y="470" width="12" height="50"/><rect x="1054" y="455" width="12" height="60"/></g>
</svg>
